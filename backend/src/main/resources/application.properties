# ==============================================================
# SmartShelfX Backend - Application Configuration
# ==============================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=smartshelfx-backend

# MySQL Database Configuration
# Using environment variables if provided, falling back to local defaults
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartshelfx?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# 'update' automatically updates the schema in development mode without dropping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT (JSON Web Token) Security Settings
# Secret must be at least 256 bits (32 bytes) long for HS256 algorithm
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# External Python AI Forecasting Service URL
ai.service.url=${AI_SERVICE_URL:http://localhost:5000}
ai.service.timeout-ms=5000
